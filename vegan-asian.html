<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#F2E4D9">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Vegan Asian Cookbook Recipe Signup</title>
  <link rel="icon" type="image/x-icon" href="vegan-asian.ico">

  <style>
    :root {
      --text-color: white;

      --form-background: #FFFFFF88;
      --primary: #ad1109AA;
      --button-hover: #ad1109DD;
      --loading: #ad1109;
      --loading-text: white;
      --input-background-color: #ffffffAA;
      --input-disabled: #aaaaaa88;
      --input-border-size: 2px;
      --input-focus-color: #356768CC;
      --input-border-style: var(--input-border-size) inset #22222288;
      --input-disabled-border-style: var(--input-border-size) inset #88888866;
      --background: url(vegan-asian-background.jpg);
      --background-filter: blur(5px);
      --background-color: #F2E4D9;
      --entry-background-odd: #FFFFFF88;
      --entry-background-even: #FFFFFF88;
      --entry-text-odd: white;
      --entry-text-even: white;
      --main-title: white;
      --main-title-drop-shadow: var(--primary);
      --form-title: white;
      --form-title-shadow: red;
      --form-title-weight: bold;
      --secondary-title: white;
      --secondary-title-shadow: #ad1109;
      --ingredient-list-style: square;
    }
  </style>
  <link rel="stylesheet" href="assets/pan-loader.css">
  <link rel="stylesheet" href="main.css">
</head>

<body>
  <div id="background" class="fullscreen"></div>
  <div id="main" class="hidden">
    <h1>Rosie's<br />Cookbook Club</h1>

    <form id="signupForm" class="hidden">
      <h2 style="margin: 5px;">Recipe Signup</h2>
      <input type="text" id="alt" placeholder="translation" disabled>
      <input type="search" id="recipe" list="recipes" autocomplete="off" placeholder="choose a recipe" required>
      <datalist id="recipes"></datalist>
      <input type="text" id="category" placeholder="category" disabled>
      <input type="text" id="chef" autocomplete="given-name" placeholder="Chef" required>
      <input type="text" id="sous-chef" placeholder="sous-chef (optional)">
      <input type="text" id="notes" placeholder="notes (optional)">
      <button type="submit">Claim Recipe</button>
    </form>

    <div id="summary" class="hidden">
      <div class="card">
        <h2>Claimed!</h2>
        <p>
          <b><span id="recipeName"></span></b>
          </br>
          <span id="recipeTranslation" style="opacity: 0.8;"></span>
          </br></br>
          <span id="recipeCategory"></span>
          (page <span id="recipePage">0</span>)
        </p>
        <h2>Ingredients</h2>
        <p><i><span id="recipeYield"></span></i></p>
        <p><i>Difficulty: <span id="recipeDifficulty"></span></i></p>
        <ul id="ingredientList"></ul>
      </div>
    </div>

    <div id="claimAgain" class="hidden" style="padding-bottom: 30px">
      <button type="reset">Claim Another</button>
    </div>
    <form id="eventPassed" class="hidden">
      <h2>The event has passed :(</h2>
    </form>

    <h2>Claimed Recipes</h2>

    <!-- Snake Loading GIF from https://briankuhnart.myportfolio.com/ -->
    <div id="recipeLoading" class="centered-hz" style="width: 80vw">
      <img src="assets/slithering-snake.gif" style="max-width: 100%; max-height: 100%; opacity: .8; filter: drop-shadow(0 0 8px white)" title="Loading" />
    </div>
    <div id="recipeList"></div>
  </div>

  <!-- Pancake Loader by https://dariocorsi.com/ -->
  <div id="loading" class="hidden fullscreen">
    <div id="popup" class="centered">
      <div id="pancake" class="loader">
        <div class="tall-stack">
          <div class="butter falling-element"></div>
          <div class="pancake falling-element"></div>
          <div class="pancake falling-element"></div>
          <div class="pancake falling-element"></div>
          <div class="pancake falling-element"></div>
          <div class="pancake falling-element"></div>
          <div class="pancake falling-element"></div>
          <div class="plate">
            <div class="plate-bottom"></div>
            <div class="shadow"></div>
          </div>
        </div>
      </div>
      <h2>Welcome to the party!<br />Please be patient :3</h2>
    </div>
  </div>
  <script type="module">
    import { categories, recipes } from "./vegan-asian-recipes.js";
    import { App } from "./main.js";
    const discourageMsg = [
      "This recipe is discouraged for one of the following reasons:",
      "🤏 too small - if bringing, make sure it is accompanying a main dish",
      "🍜 it is a soup - this will be difficult to serve :(",
      "\nThis does not mean you cannot choose this recipe, just please proceed with care",
    ].join('\n')
    const CONFIG = {
      CLUB_ID: "2609_vegan_asian",
      EVENT_DATE: new Date('2026-09-20T18:30'),
      VALIDATE_RECIPES: true,
      RECIPES: recipes,
      DISCOURAGE_MSG: discourageMsg,
    }
    App.init(CONFIG);
  </script>

</body>

</html>
